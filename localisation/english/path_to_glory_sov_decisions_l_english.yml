l_english:
 SOV_paranoia_system:0 "Political Paranoia"
 SOV_paranoia_system_desc:0 "An atmosphere of suspicion and mistrust hangs over [ROOT.GetNameDef]. [ROOT.GetLeader]'s concerns about factionalism within the party grow as countless accusations and alleged acts of sabotage, wreckage and espionage are being investigated by the NKVD."
 SOV_paranoia_bg_tooltip:0 "If £SOV_paranoia_text_icon §YParanoia§! value increases over §Y25§!, random purge events may occur. \nThe higher the £SOV_paranoia_text_icon §YParanoia§!, and the more days it has been that high, the more likely it is for a purge to happen. \nIf £SOV_paranoia_text_icon §YParanoia§! value increases over §R75§!, great purge events may occur. \n\nCertain §Yfocus§!, §Ydecision§! and §Yeffects§! will make £SOV_paranoia_text_icon §YParanoia§! immediately increase/decrease, and certain advisor and country leader traits will slowly increase §YParanoia§! over time. \n\nCompleting the focus §Y[GetAppropriateLastPurgeFocusName]§! will remove the £SOV_paranoia_text_icon §YParanoia§! system."
 SOV_paranoia_text_tooltip:0 "[GetAppropriateParanoiaTooltip]"
 SOV_paranoia_text_tooltip_default:0 "§YWeekly £SOV_paranoia_text_icon Paranoia affected by:§! \n[GetLeaderTrait] \n[GetNKVDTrait]"
 SOV_paranoia_text_tooltip_not_active:0 "Political Paranoia is no longer active."
 SOV_paranoia_tooltip_stalin_default:0 "$SOV_iosif_stalin$ ($stalin_political_paranoia$): §R+1%§!"
 SOV_paranoia_tooltip_stalin_advanced:0 "$SOV_iosif_stalin$ ($stalin_political_paranoia$): §R+2%§!"
